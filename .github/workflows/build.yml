name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装打包工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt zipalign apksigner

      - name: 安装 Android SDK platform（提供 android.jar 与 r8.jar）
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34"

      - name: 编译
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: zybclean-apk
          path: zybclean.apk
          if-no-files-found: error

      - name: 发布 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: zybclean.apk
