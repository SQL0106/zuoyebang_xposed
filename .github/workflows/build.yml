name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 同一分支新提交取消旧构建，省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 定位 Android SDK 目录
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK_DIR=$SDK" >> "$GITHUB_ENV"
          echo "SDK_DIR=$SDK"

      # platform zip 63MB，缓存下来省下载；解压后体积大、没必要缓存解压结果
      - name: 缓存 platform zip
        uses: actions/cache@v4
        with:
          path: ~/android-platform-zip
          key: platform-34-ext7_r02-zip-v1

      - name: 安装打包工具（apt 缓存到 runner 自带镜像）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends aapt zipalign apksigner

      # 不用 sdkmanager：它装出来的 android.jar 在 Debian/Ubuntu 的 aapt 下会报
      # "Entry offset at index N points outside the Type's boundaries"。
      # 直接下与本机完全一致的官方 zip，并用 aapt 做冒烟链接验证。
      - name: 准备 Android platform（官方 zip + 冒烟验证）
        env:
          PLATFORM_ZIP: platform-34-ext7_r02.zip
        run: |
          set -euo pipefail
          zip_dir="$HOME/android-platform-zip"
          mkdir -p "$zip_dir"
          zip="$zip_dir/$PLATFORM_ZIP"
          if ! unzip -tq "$zip" >/dev/null 2>&1; then
            echo "下载 $PLATFORM_ZIP"
            curl -sSL --retry 5 --retry-delay 3 -o "$zip" "https://dl.google.com/android/repository/$PLATFORM_ZIP"
          fi
          unzip -t "$zip" | tail -2
          rm -rf "$SDK_DIR/platforms/android-34"
          mkdir -p "$SDK_DIR/platforms"
          unzip -q -o "$zip" -d "$SDK_DIR/platforms"
          ls -l "$SDK_DIR/platforms"/*/android.jar
          jar="$SDK_DIR/platforms/android-34/android.jar"
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="smoke.test">' \
            '<uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" /></manifest>' \
            > "$RUNNER_TEMP/smoke.xml"
          aapt package -f -M "$RUNNER_TEMP/smoke.xml" -I "$jar" -F "$RUNNER_TEMP/smoke.apk"
          echo SMOKE_OK

      - name: 编译
        shell: bash
        run: |
          set -o pipefail
          chmod +x build.sh
          ./build.sh 2>&1 | tee build.log

      - name: 编译信息
        if: always()
        shell: bash
        run: |
          {
            echo "== java"; java -version 2>&1
            echo "== sdk"; echo "$SDK_DIR"; ls "$SDK_DIR/platforms" "$SDK_DIR/build-tools" 2>&1
            echo "== tools"; aapt version 2>&1 | head -2; apksigner --version 2>&1 | head -2
            echo "== 产物"; ls -l zybclean.apk 2>&1
            echo "== build 目录"; find build -maxdepth 2 2>/dev/null | head -50
          } > build-info.txt

      # 失败时把日志 + 中间产物一起留下，方便本地复现
      - name: 失败现场打包
        if: failure()
        shell: bash
        run: |
          {
            echo "== 失败的 commit: $GITHUB_SHA"
            echo "== 事件: $GITHUB_EVENT_NAME / $GITHUB_REF"
          } > failure-context.txt
          tar czf build-failure.tar.gz build.log build-info.txt failure-context.txt build 2>/dev/null \
            || tar czf build-failure.tar.gz build.log build-info.txt failure-context.txt 2>/dev/null || true
          ls -l build-failure.tar.gz 2>&1 || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zybclean-apk
          path: zybclean.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传日志（总是）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            build.log
            build-info.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: 上传失败现场（失败时）
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure
          path: |
            build-failure.tar.gz
            build-info.txt
            failure-context.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: 发布 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: zybclean.apk
          generate_release_notes: true
